name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore WEB_Demo.sln --locked-mode
      - name: Build API
        run: dotnet build src/WEB_Demo.Api/WEB_Demo.Api.csproj --configuration Release --no-restore
      - name: Run backend tests
        run: dotnet test WEB_Demo.sln --configuration Release --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/WEB_Demo.Client
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/WEB_Demo.Client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Build production client
        run: npm run build

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate all OpenSpec artifacts
        run: npm run spec:validate

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      E2E_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=web_demo_e2e;Password=ci-e2e-only-password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: web_demo_e2e
          POSTGRES_PASSWORD: ci-e2e-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U web_demo_e2e -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/WEB_Demo.Client/package-lock.json
      - name: Restore locked .NET dependencies
        run: dotnet restore WEB_Demo.sln --locked-mode
      - name: Install frontend dependencies
        working-directory: src/WEB_Demo.Client
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: src/WEB_Demo.Client
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: src/WEB_Demo.Client
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/WEB_Demo.Client/playwright-report
            src/WEB_Demo.Client/test-results
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: web_demo_ci
      POSTGRES_USER: web_demo_ci
      POSTGRES_PASSWORD: ci-compose-placeholder-password
      JWT_SIGNING_KEY: ci-placeholder-signing-key-at-least-32-characters
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build api gateway
